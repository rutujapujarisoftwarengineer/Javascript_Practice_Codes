<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Practice</title>

    <script>
        function myFunction(){
            document.getElementById("demo").innerHTML = "Paragraph changed."
        }
    </script>
</head>
<body>
    <h1>Demo javascript in Head</h1>
    <p id="demo">This is Paragraph</p>
    <button type="button" style="border: solid green" onclick="myFunction()">Click Here</button>
</body>
</html>
